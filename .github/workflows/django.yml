name: Django CI

on:
  push:
    branches: ["main", "TestingByBao"]
  pull_request:
    branches: ["main", "TestingByBao"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --exclude=myworld,env,.venv,venv,migrations --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests with Coverage
        run: |
          # Tìm đường dẫn chứa manage.py và chạy test
          MANAGE_PATH=$(find . -name "manage.py" -type f | head -n 1)
          DIR_PATH=$(dirname "$MANAGE_PATH")
          cd "$DIR_PATH"
          coverage run manage.py test
          coverage report
