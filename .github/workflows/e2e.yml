name: CodeceptJS E2E Test

on:
  push:
    branches: ["main", "thao/testing"]
  pull_request:
    branches: ["main"]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SHOW_BROWSER: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r website_django-main/web_trangsuc/requirements.txt

      - name: Install Node Dependencies & Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Migrate, seed, run Django & CodeceptJS
        run: |
          DIR=website_django-main/web_trangsuc
          python "$DIR/manage.py" migrate --noinput
          python "$DIR/manage.py" seed_e2e
          python "$DIR/manage.py" runserver 127.0.0.1:8000 &
          npx --yes wait-on http://127.0.0.1:8000 --timeout 60000
          npx codeceptjs run --steps
