name: CodeceptJS E2E Test

on:
  push:
    branches: ["main", "TestingByBao"]
  pull_request:
    branches: ["main", "TestingByBao"]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies & Playwright Browsers
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run Django Server & Execute E2E Tests
        run: |
          MANAGE_PATH=$(find . -name "manage.py" -type f | head -n 1)
          DIR_PATH=$(dirname "$MANAGE_PATH")

          mkdir -p "$DIR_PATH/static"

          python "$DIR_PATH/manage.py" migrate
          python "$DIR_PATH/manage.py" runserver 8000 &

          npx wait-on http://127.0.0.1:8000 --timeout 30000

          # Chạy test E2E ép buộc headless mode
          CI=true npx codeceptjs run --steps
